on:
  workflow_dispatch:
    inputs:
      version-level:
        description: "Version bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: write-all

name: Tag & Release
run-name: Cut ${{'{'}}{ inputs.version-level }} tag by @${{'{'}}{ github.triggering_actor }}

jobs:
  tag_and_release:
    name: Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: p6m-actions/dotnet-setup@v1

      - name: Login to .NET Repository
        uses: p6m-actions/dotnet-repository-login@v1
        with:
          repository: ${{'{'}}{ vars.P6M_ARTIFACTORY_PROJECT }}-nuget
          repository-url: https://${{'{'}}{ vars.P6M_ARTIFACTORY_HOSTNAME }}/artifactory/api/nuget/${{'{'}}{ vars.P6M_ARTIFACTORY_PROJECT }}-nuget
          username: ${{'{'}}{ secrets.P6M_ARTIFACTORY_USERNAME }}
          password: ${{'{'}}{ secrets.P6M_ARTIFACTORY_IDENTITY_TOKEN }}

      - name: Cut Tag
        id: cut-tag
        uses: p6m-actions/dotnet-cut-tag@v1
        with:
          version-level: ${{'{'}}{ inputs.version-level }}

      - name: Build .NET Application
        uses: p6m-actions/dotnet-build@v1
        with:
          run-tests: true
          test-filter: "Category!=Integration"
          version: ${{'{'}}{ steps.cut-tag.outputs.version }}

      - name: Login to Docker Repository
        uses: p6m-actions/docker-repository-login@v1
        with:
          registry: ${{'{'}}{ vars.P6M_ARTIFACTORY_HOSTNAME }}
          username: ${{'{'}}{ secrets.P6M_ARTIFACTORY_USERNAME }}
          password: ${{'{'}}{ secrets.P6M_ARTIFACTORY_IDENTITY_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: p6m-actions/docker-buildx-setup@v1

      - name: Build and Publish Docker Image
        id: docker-publish
        uses: p6m-actions/docker-buildx-build-publish@v1
        with:
          image-name: {{ prefix-name }}-{{ suffix-name }}-server
          image-tag: ${{'{'}}{ steps.cut-tag.outputs.version }}
          registry: ${{'{'}}{ vars.P6M_ARTIFACTORY_HOSTNAME }}/${{'{'}}{ vars.P6M_ARTIFACTORY_PROJECT }}-docker-local/applications
          push: true
          skip-setup: true
          builder-name: ${{'{'}}{ steps.buildx.outputs.name }}
          secrets: |
            artifactory-token=${{'{'}}{ secrets.P6M_ARTIFACTORY_TOKEN }}

      - name: Publish to .NET Repository
        uses: p6m-actions/dotnet-repository-publish@v1
        with:
          repositories: |
            ${{'{'}}{ vars.P6M_ARTIFACTORY_PROJECT }}-nuget
        env:
          NUGET_API_KEY: "${{'{'}}{ secrets.P6M_ARTIFACTORY_USERNAME }}:${{'{'}}{ secrets.P6M_ARTIFACTORY_IDENTITY_TOKEN }}"

      - name: Make Artifacts
        run: |
          echo '${{'{'}}{ steps.docker-publish.outputs.image-digest }}' | tee digest.txt

      - uses: ncipollo/release-action@v1
        with:
          name: Version ${{'{'}}{ steps.cut-tag.outputs.version }}
          tag: ${{'{'}}{ steps.cut-tag.outputs.tag }}
          makeLatest: true
          artifacts: "digest.txt"
          removeArtifacts: true
          generateReleaseNotes: true
          body: |
            Application version: `${{'{'}}{ steps.cut-tag.outputs.version }}`
            Docker image digest: `${{'{'}}{ steps.docker-publish.outputs.image-digest }}`
